# @local/dsh-wallpaper profile patch — plugin insertion only.
#
# Fork of @frog755/dsh-wallpaper. Changes versus the upstream patch:
#   - The webserver entry that pinned DSH to port 9191 is REMOVED. This
#     deployment serves the Web GUI on its own port (3080), and wallpaper
#     configuration now persists in the host user-settings document
#     (~/.dsh/settings.yaml, `wallpaper` namespace) instead of browser
#     localStorage, so a fixed origin is no longer needed for persistence.
- insert:
    - id: wallpaper
      name: '@local/dsh-wallpaper'
