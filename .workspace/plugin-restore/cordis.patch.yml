# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# ============================================================================
# plugin-restore 修正版（2026-09-12，产物 .workspace/plugin-restore/）
# 相对 9/12 14:44 运行盘面（~/.dsh/profiles/web/cordis.patch.yml，41 行）的改动：
#
#   [删除] disabled "wallpaper"                          —— 0.1.5 尝试期残留
#           （dsh-fix 06:31:35Z 写入；lag-audit-diff.md 判定为 0.1.5 尝试期残留，
#             9/11 备份基线中无此条目）
#   [删除] disabled "vision-adam"                        —— 0.1.5 尝试期残留（06:32:30Z 写入）；
#           恢复启用（insert 条目保留在下方，基线中即启用）
#   [删除] disabled "subagent-model-selection-settings"  —— 0.1.5 尝试期残留（06:32:30Z 写入）；
#           该 id 是 0.1.5 dsh-tool-subagent 的子插件（web2 树
#           lib/model-selection-settings.js），0.1.1 全局树无此 id →
#           条目 inert（禁用一个不存在的东西），纯清理
#   [删除] disabled "taste"                              —— 0.1.5 尝试期残留（06:44:42Z 写入）
#   [保留] insert vision-adam / taste / btw / wallpaper  —— 与 9/11 升级前备份
#           （~/dsh-upgrade-backup/dsh-home-config.tgz ./profiles/web/cordis.patch.yml）一致
#   [不动] insert btw（@local/dsh-btw）与 agent-presets.default=standard-glm
#
# 语义等价于升级前基线；本文件未引入任何新机制（无新 insert、无新 config 键）。
# ============================================================================
- insert:
    - id: vision-adam
      name: '@deepseek-ai/dsh-vision-adam'

# 默认 agent preset 换成用户自建的 standard-glm（$DSH_HOME/.agent-presets/）：
# 与官方 standard 唯一区别是 subagent / subagent_fork 的 agentOptions 固定
# provider=adam、model=deepseek-v4-flash。组合变更需重启 DSH 后对新会话生效。
- id: agent-presets
  config:
    default: standard-glm
- insert:
    - id: taste
      name: '@deepseek-ai/dsh-taste'
- insert:
    - id: btw
      name: '@local/dsh-btw'

# 壁纸插件（@frog755/dsh-wallpaper 的本地 fork，静态图片版）：
# per-page 覆盖 + 暗色遮罩 + URL/路径/上传来源，配置走 ~/.dsh/settings.yaml。
- insert:
    - id: wallpaper
      name: '@local/dsh-wallpaper'
