<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PPT大师功能预览</title>
  <desc id="desc">展示科技发布、数据报告和浏览器编辑导出能力</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f8f2"/>
      <stop offset="1" stop-color="#e8eee8"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff65"/>
      <stop offset="0.52" stop-color="#62dfd2"/>
      <stop offset="1" stop-color="#8f63ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#15362c" flood-opacity=".18"/>
    </filter>
    <clipPath id="clip1"><rect x="63" y="218" width="500" height="281" rx="18"/></clipPath>
    <clipPath id="clip2"><rect x="637" y="218" width="500" height="281" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="url(#pageBg)"/>
  <circle cx="1110" cy="70" r="210" fill="#d8ff65" opacity=".2"/>
  <circle cx="130" cy="650" r="250" fill="#68dfd0" opacity=".12"/>

  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="62" y="49" width="50" height="50" rx="14" fill="#123e31"/>
    <path d="M76 65h22M76 75h16M76 85h26" stroke="#d9ff67" stroke-width="5" stroke-linecap="round"/>
    <text x="128" y="86" font-size="36" font-weight="800" fill="#13382e">PPT大师</text>
    <text x="1118" y="83" text-anchor="end" font-size="20" font-weight="600" fill="#507066">12套专业风格</text>

    <text x="62" y="156" font-size="50" font-weight="850" fill="#102f27">一句话，生成可编辑的专业 PPT</text>
    <text x="64" y="194" font-size="21" fill="#5d736c">自动编排 · 浏览器编辑 · HTML / PDF / PPTX 多格式导出</text>

    <g filter="url(#shadow)">
      <rect x="63" y="218" width="500" height="281" rx="18" fill="#07110e"/>
      <g clip-path="url(#clip1)">
        <circle cx="540" cy="230" r="160" fill="#48e2ca" opacity=".11"/>
        <circle cx="470" cy="480" r="150" fill="#8c63ff" opacity=".12"/>
        <rect x="88" y="245" width="96" height="26" rx="13" fill="#152a23" stroke="#86ffa6"/>
        <text x="136" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#8cff9f">AI PRODUCT</text>
        <text x="91" y="325" font-size="34" font-weight="800" fill="#f2f7f2">AI 产品</text>
        <text x="91" y="366" font-size="34" font-weight="800" fill="#b8ff50">增长策略</text>
        <text x="91" y="401" font-size="14" fill="#a7b7b0">从市场机会到产品落地的完整路径</text>
        <text x="91" y="458" font-size="38" font-weight="800" fill="#63dfd2">3×</text>
        <text x="153" y="457" font-size="13" fill="#c6d2cc">关键指标增长</text>
        <rect x="339" y="280" width="180" height="142" rx="16" fill="#0e211b" stroke="#265c4a"/>
        <path d="M362 385l34-28 28 13 36-55 36 21" fill="none" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="460" cy="315" r="8" fill="#d8ff65"/>
        <text x="88" y="485" font-size="11" fill="#6e857c">科技发布 · 炫光紫绿风</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="637" y="218" width="500" height="281" rx="18" fill="#ffffff"/>
      <g clip-path="url(#clip2)">
        <rect x="637" y="218" width="500" height="48" fill="#133d32"/>
        <circle cx="666" cy="242" r="7" fill="#d8ff65"/>
        <text x="684" y="248" font-size="16" font-weight="700" fill="#f7faf7">演示控制台</text>
        <rect x="1019" y="229" width="88" height="27" rx="7" fill="#d8ff65"/>
        <text x="1063" y="247" text-anchor="middle" font-size="12" font-weight="800" fill="#173b30">导出</text>
        <rect x="637" y="266" width="82" height="233" fill="#f1f3ef"/>
        <rect x="649" y="283" width="58" height="36" rx="5" fill="#102c25" stroke="#4adfc8" stroke-width="3"/>
        <rect x="649" y="332" width="58" height="36" rx="5" fill="#ffffff" stroke="#ccd5d0"/>
        <rect x="649" y="381" width="58" height="36" rx="5" fill="#f6ff9e" stroke="#ccd5d0"/>
        <rect x="649" y="430" width="58" height="36" rx="5" fill="#ffffff" stroke="#ccd5d0"/>
        <rect x="741" y="290" width="278" height="156" rx="10" fill="#102c25"/>
        <text x="762" y="326" font-size="13" fill="#86ff9e">核心数据</text>
        <text x="762" y="379" font-size="46" font-weight="850" fill="#f4f7f3">97%</text>
        <text x="762" y="410" font-size="13" fill="#b7c6bf">页面可继续编辑和替换</text>
        <rect x="1035" y="284" width="82" height="146" rx="8" fill="#f4f5f0"/>
        <rect x="1047" y="299" width="58" height="8" rx="4" fill="#c9d1cc"/>
        <rect x="1047" y="320" width="58" height="23" rx="6" fill="#ffffff" stroke="#d7ddd9"/>
        <rect x="1047" y="357" width="26" height="26" rx="6" fill="#d8ff65"/>
        <rect x="1079" y="357" width="26" height="26" rx="6" fill="#65dfd0"/>
        <rect x="1047" y="397" width="58" height="10" rx="5" fill="#1c654e"/>
        <text x="742" y="479" font-size="11" fill="#667b73">浏览器内编辑 · 一键导出多种格式</text>
      </g>
    </g>

    <g transform="translate(63 550)">
      <rect width="252" height="66" rx="16" fill="#ffffff" stroke="#dce3de"/>
      <circle cx="34" cy="33" r="18" fill="#123e31"/>
      <path d="M26 33l6 6 11-14" fill="none" stroke="#d8ff65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="29" font-size="15" font-weight="800" fill="#17382f">自动整理结构</text>
      <text x="64" y="49" font-size="12" fill="#6e8079">封面、数据、流程、案例</text>
    </g>
    <g transform="translate(337 550)">
      <rect width="252" height="66" rx="16" fill="#ffffff" stroke="#dce3de"/>
      <circle cx="34" cy="33" r="18" fill="#123e31"/>
      <path d="M26 34h16M34 26v16" stroke="#d8ff65" stroke-width="4" stroke-linecap="round"/>
      <text x="64" y="29" font-size="15" font-weight="800" fill="#17382f">12 套视觉主题</text>
      <text x="64" y="49" font-size="12" fill="#6e8079">商务、科技、数据、品牌</text>
    </g>
    <g transform="translate(611 550)">
      <rect width="252" height="66" rx="16" fill="#ffffff" stroke="#dce3de"/>
      <circle cx="34" cy="33" r="18" fill="#123e31"/>
      <path d="M25 29h18v14H25zM29 25h18v14" fill="none" stroke="#d8ff65" stroke-width="3" stroke-linejoin="round"/>
      <text x="64" y="29" font-size="15" font-weight="800" fill="#17382f">生成后仍可编辑</text>
      <text x="64" y="49" font-size="12" fill="#6e8079">改文字、换图片、调页面</text>
    </g>
    <g transform="translate(885 550)">
      <rect width="252" height="66" rx="16" fill="#123e31"/>
      <circle cx="34" cy="33" r="18" fill="#d8ff65"/>
      <path d="M34 22v20M26 35l8 8 8-8" fill="none" stroke="#123e31" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="29" font-size="15" font-weight="800" fill="#ffffff">HTML / PDF / PPTX</text>
      <text x="64" y="49" font-size="12" fill="#c7d6d0">多格式导出与交付</text>
    </g>
