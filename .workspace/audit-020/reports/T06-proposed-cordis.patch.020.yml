# ============================================================================
# 0.2.0 profile patch layer — T06 DRAFT (审查用，勿直接覆盖现役 profile)
# 依据：reports/T06-official-patch-layer-020.md
# 目标 profile：@deepseek-ai/dsh 0.2.0-rc.1 + dsh-base/dsh-web-app 0.2.0-rc.1
#
# 加载顺序（app-boot `readProfilePatches`）：dsh-base → dsh-web-app（含
# presets/standard|ptc|minimal|cordis）→ 本文件 → $DSH_HOME/cordis.patch.yml
# → `--patch` 覆盖层 → telemetry 开关。
# 语义要点：`config` 是**整体替换**而非深合并 ⇒ 覆盖某行必须复述它拥有的全部键。
#
# 每条条目的依据类型（见报告 §2.4）：
#   [lib全等]  目标包不在 churn-lib-017-020.txt 的 55 个改动包内 ⇒ lib/ 逐字节
#              相同 ⇒ 其 id/导出/注册点/Config schema 必然未变
#   [源码实读] 目标包在 55 改动包内 ⇒ 已读 0.2.0 源码逐键确认
#   [组合复算] 用与 app-boot 同一份 applyEntryPatches 算法叠加到 0.2.0 官方
#              组合（183 行）上复算，结果 0 warning
# ============================================================================

# ── A. 可直接落地（0.2.0 上 id/name/peer 全部核实通过）────────────────────
# [lib全等] 以下 5 个 @local/* 包均不在 55 改动包内（它们是本地包，不在官方树），
#           peer 判定见报告 §5.1；行本身为新增 insert，不依赖官方 id。

# 本地插件：peer 与 0.2.0 兼容，仅需把包装进新 profile 的 node_modules。
- insert:
    - id: btw
      name: '@local/dsh-btw'
- insert:
    - id: wallpaper
      name: '@local/dsh-wallpaper'
- insert:
    - id: usage
      name: '@local/dsh-usage'
- insert:
    - id: ssh-gui
      name: '@local/dsh-ssh-gui'
- insert:
    - id: logfile
      name: '@local/dsh-logfile'
      config:
        level: 2
        maxBytes: 8388608
        maxFiles: 3
        orphanWatch: true

# 官方行定向覆盖：0.2.0 组合里这些 id 均存在且 name 未变。
# [组合复算] 0.1.7→0.2.0 官方组合 id 差集仅 {time-context, schedule, ui-schedule}，
#           本层定向的 id 一个都不在其中。
# [lib全等] dsh-agent-preset-registry 虽在 55 名单（churn 4.2%），但改动文件是
#          lib/typert.host.js；承载 Config 的 lib/index.js 逐字节相同 ⇒ default 键未变。
- id: agent-preset-registry
  config:
    default: standard-glm
# [lib全等] 同上：只有 lib/client.js 变，lib/index.js 相同 ⇒ welcomeNoticeVersion 键未变。
- id: ui-settings-general
  config:
    welcomeNoticeVersion: 2026-08-13.1
# [lib全等] 只有 lib/client.js 变，lib/index.js 相同 ⇒ preference 键未变。
- id: ui-theme
  config:
    preference: light
# [lib全等] dsh-agent-default-model 不在 55 名单内。
- id: agent-default-model
  config:
    provider: adam
    model: gpt-6-astra
# [源码实读] dsh-web-search-deepseek 是本层唯一 churn 75% 的目标包：已读 0.2.0
#          lib/index.js，apiKeyEnv（默认 DEEPSEEK_API_KEY）/baseURL/maxUses/model
#          四个键仍在；153/163 行仍是无条件 response.json()（SSE fork 的理由未消失）。
- id: web-search-deepseek
  config:
    # apiKeyEnv 必须复述：0.2.0 官方值就是 DEEPSEEK_API_KEY（也是插件默认值）
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://llmapi.roboscience.xyz/v1
    maxUses: 100000
    model: claude-opus-4-6
# [lib全等] dsh-web 不在 55 名单内；searchProvider/fetchProvider 均为 z.string()。
- id: web
  config:
    searchProvider: deepseek-sse
    fetchProvider: http

# 目录选择器：官方 directory-picker（@deepseek-ai/dsh-host-directory-picker-auto）
# 在 0.1.1/0.1.7/0.2.0 三层中 id 与 name 均未变；browse 后端在 0.2.0 仍是
# dsh-web-app 的依赖但**未被官方组合挂载**，故本地仍须自行 insert。
# [lib全等] dsh-host-directory-picker-auto 不在 55 名单内。
- id: directory-picker
  disabled: true
# [lib全等] dsh-host-directory-picker-browse 不在 55 名单内（须装 0.2.0-rc.1 版包）。
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

# N13：0.2.0 的 dsh-client-connection 静态 inject 仍是 ["credentials"]，
# 而 web-app 层已把该行覆盖为 inject: [webRuntime]；本层再补 webServer
# ⇒ 写成 [webRuntime, webServer]（entry 层与静态层取并集，故不写 credentials）。
# [lib全等] dsh-client-connection 不在 55 名单内；webServer 服务名在 dsh-host-webserver
#          0.2.0 中仍是 super(ctx, "webServer")。
- id: connection
  inject: [webRuntime, webServer]

