              # 网关无渠道（2026-09-25 实测：HTTP 500『分组 auto 下模型 ... 的可用渠道不存在』／HTTP 503 model_not_found，且不在 /v1/models 自报清单）
              # 保留备用，勿据此判断模型能力；渠道恢复后删掉本注释即可。
            - id: gpt-6-sol
              input:
                - text
                - image
            - id: qwen3.8-max-0902
